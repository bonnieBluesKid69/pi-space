name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check sources
        run: make check
      - name: Build and validate bundles
        run: ./scripts/build.sh --clean
      - name: Verify bundles
        run: |
          set -euo pipefail
          codesign --verify --deep --strict "dist/Pi Space.app"
          plutil -lint "dist/Pi Space.app/Contents/Info.plist"
          archs="$(lipo -archs 'dist/Pi Space.app/Contents/MacOS/PiSpace')"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test Windows provider configuration
        run: dotnet run --project Platforms/Windows/Tests/PiSpace.Windows.Tests.csproj --configuration Release
      - name: Build Windows shell
        run: dotnet build Platforms/Windows/PiSpace.Windows.csproj --configuration Release
      - name: Publish Windows shell
        run: dotnet publish Platforms/Windows/PiSpace.Windows.csproj --configuration Release --runtime win-x64 --self-contained false --output dist/windows
      - name: Verify Windows package
        shell: pwsh
        run: |
          if (!(Test-Path "dist/windows/PiSpace.exe")) { throw "PiSpace.exe was not published" }
          if (!(Test-Path "dist/windows/Resources/PiSpace.html")) { throw "Shared UI was not published" }
          if (!(Test-Path "dist/windows/Resources/pi-space-bridge.js")) { throw "Shared bridge was not published" }
          if (!(Test-Path "dist/windows/Resources/kokoro-windows-synthesize.py")) { throw "Windows Kokoro helper was not published" }
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Space-Windows-x64
          path: dist/windows
          if-no-files-found: error
          retention-days: 14
