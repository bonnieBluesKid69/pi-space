name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate tag and project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "Platforms/Windows/PiSpace.Windows.csproj"
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($version -ne $tag) { throw "Tag v$tag does not match Windows project version $version" }
      - name: Test Windows contracts
        run: dotnet run --project Platforms/Windows/Tests/PiSpace.Windows.Tests.csproj --configuration Release
      - name: Publish Windows x64
        run: dotnet publish Platforms/Windows/PiSpace.Windows.csproj --configuration Release --runtime win-x64 --self-contained false --output dist/windows
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/windows/*" -DestinationPath "dist/Pi-Space-Windows-x64.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/Pi-Space-Windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Pi-Space-Windows-x64.zip" | Set-Content -NoNewline "dist/Pi-Space-Windows-x64.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Pi-Space-Windows-x64.zip
            dist/Pi-Space-Windows-x64.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and app version
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          tag="${GITHUB_REF_NAME#v}"
          [[ "$version" == "$tag" ]] || { echo "Tag v$tag does not match macOS version $version" >&2; exit 1; }
      - name: Build and package macOS
        run: ./scripts/package.sh
      - name: Verify macOS release assets
        run: |
          set -euo pipefail
          test -f release/Pi-Space-macOS.dmg
          test -f release/Pi-Space-macOS.sha256
          (cd release && shasum -a 256 -c Pi-Space-macOS.sha256)
          hdiutil verify release/Pi-Space-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/Pi-Space-macOS.dmg
            release/Pi-Space-macOS.sha256
            release/Pi-Space-*-macOS.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
